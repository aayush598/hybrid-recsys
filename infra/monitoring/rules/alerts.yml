groups:
  - name: beautyrec_alerts
    rules:
      - alert: HighErrorRate
        expr: rate(beautyrec_http_requests_total{status_code=~"5.."}[5m]) / rate(beautyrec_http_requests_total[5m]) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value | humanizePercentage }} (threshold: 5%)"

      - alert: HighLatency
        expr: histogram_quantile(0.95, rate(beautyrec_http_request_duration_seconds_bucket[5m])) > 1.0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High P95 latency"
          description: "P95 latency is {{ $value }}s (threshold: 1s)"

      - alert: HighRecommendationLatency
        expr: histogram_quantile(0.95, rate(beautyrec_recommendation_latency_seconds_bucket[5m])) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Recommendation latency too high"
          description: "P95 recommendation latency is {{ $value }}s"

      - alert: ServiceDown
        expr: up{job="beautyrec-backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "BeautyRec backend is down"
          description: "Backend service has been unreachable for more than 1 minute"

      - alert: HighMemoryUsage
        expr: process_resident_memory_bytes / 1024 / 1024 > 2048
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage"
          description: "Memory usage is {{ $value }}MB (threshold: 2GB)"

      - alert: HighActiveRequests
        expr: beautyrec_active_requests > 100
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Too many concurrent requests"
          description: "{{ $value }} concurrent requests (threshold: 100)"
