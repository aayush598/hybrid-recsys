apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: beautyrec-staging

nameSuffix: -staging

commonLabels:
  environment: staging

resources:
  - ../../base

# Staging: reduced footprint for cost efficiency.
replicas:
  - name: beautyrec-backend
    count: 1
  - name: beautyrec-frontend
    count: 1

patches:
  - target:
      kind: Deployment
      name: beautyrec-backend
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 100m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 256Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 500m
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 1Gi
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: APP_ENV
          value: staging
  - target:
      kind: Deployment
      name: beautyrec-frontend
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 25m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 32Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 100m
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 128Mi
