apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: beautyrec-prod

commonLabels:
  environment: production

resources:
  - ../../base

# Production: higher replica counts and enforced resource limits.
replicas:
  - name: beautyrec-backend
    count: 3
  - name: beautyrec-frontend
    count: 2

patches:
  - target:
      kind: Deployment
      name: beautyrec-backend
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 500m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 1Gi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "2"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 4Gi
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: APP_ENV
          value: production
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: WORKERS
          value: "4"
  - target:
      kind: Deployment
      name: beautyrec-frontend
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 50m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 64Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 200m
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 256Mi
