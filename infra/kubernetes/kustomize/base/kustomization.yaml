apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: beautyrec

# Reference the existing raw manifests as the shared base.
resources:
  - ../../base

commonLabels:
  app.kubernetes.io/part-of: beautyrec
  app.kubernetes.io/managed-by: kustomize

labels:
  - pairs:
      app.kubernetes.io/name: beautyrec
    includeSelectors: false
