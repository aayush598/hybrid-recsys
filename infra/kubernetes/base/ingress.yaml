apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: beautyrec-ingress
  namespace: beautyrec
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.beautyrec.dev
        - beautyrec.dev
      secretName: beautyrec-tls
  rules:
    - host: api.beautyrec.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: beautyrec-backend
                port:
                  number: 8000
    - host: beautyrec.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: beautyrec-frontend
                port:
                  number: 80
