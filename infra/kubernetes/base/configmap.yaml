apiVersion: v1
kind: ConfigMap
metadata:
  name: beautyrec-config
  namespace: beautyrec
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "info"
  MAX_WORKERS: "4"
  CACHE_TTL: "300"
  RATE_LIMIT_PER_MINUTE: "100"
---
apiVersion: v1
kind: Secret
metadata:
  name: beautyrec-secrets
  namespace: beautyrec
type: Opaque
stringData:
  database-url: "postgresql+asyncpg://user:pass@postgres:5432/beautyrec"
  jwt-secret: "change-me-in-production"
  redis-url: "redis://redis:6379/0"
