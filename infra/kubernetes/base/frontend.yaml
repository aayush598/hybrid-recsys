apiVersion: apps/v1
kind: Deployment
metadata:
  name: beautyrec-frontend
  namespace: beautyrec
  labels:
    app: beautyrec-frontend
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: beautyrec-frontend
  template:
    metadata:
      labels:
        app: beautyrec-frontend
        tier: frontend
    spec:
      containers:
        - name: frontend
          image: beautyrec-frontend:latest
          ports:
            - containerPort: 80
              protocol: TCP
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: beautyrec-frontend
  namespace: beautyrec
spec:
  selector:
    app: beautyrec-frontend
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
  type: ClusterIP
